name: build-g3a
on: [push, pull_request, workflow_dispatch]

jobs:
  g3a:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.giteapc
          key: fxsdk-toolchain-v2

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3 python3-pil python3-pip \
            pkg-config libpng-dev libusb-1.0-0-dev libudisks2-dev libsdl2-dev \
            libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex curl

      - name: Install fxSDK and gint with GiteaPC
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://gitea.planet-casio.com/Lephenixnoir/GiteaPC.git /tmp/GiteaPC
          cd /tmp/GiteaPC && ./install.sh
          export PATH="$HOME/.local/bin:$PATH"
          giteapc install -y Lephenixnoir/sh-elf-gcc
          giteapc install -y Lephenixnoir/fxsdk
          giteapc install -y Lephenixnoir/gint

      - name: Build BusinessFX.g3a
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk build-cg

      - uses: actions/upload-artifact@v4
        with:
          name: BusinessFX-g3a
          path: build-cg/BusinessFX.g3a
