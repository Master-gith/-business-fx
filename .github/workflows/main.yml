name: build-g3a
on: [push, pull_request, workflow_dispatch]

jobs:
  g3a:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.giteapc
          key: fxsdk-toolchain-v4

      - name: System packages
        id: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3 python3-pil python3-pip \
            pkg-config libpng-dev libusb-1.0-0-dev libudisks2-dev libsdl2-dev \
            libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex curl

      - name: Install GiteaPC
        id: gp
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://gitea.planet-casio.com/Lephenixnoir/GiteaPC.git /tmp/GiteaPC
          cd /tmp/GiteaPC
          ./install.sh

      - name: Set PATH
        id: path
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          GP=$(find "$HOME" /usr/local -name giteapc -type f 2>/dev/null | head -n 1)
          if [ -n "$GP" ]; then echo "$(dirname "$GP")" >> "$GITHUB_PATH"; fi

      - name: Install sh-elf-gcc, fxSDK and gint
        id: tc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          giteapc install -y Lephenixnoir/sh-elf-gcc
          giteapc install -y Lephenixnoir/fxsdk
          giteapc install -y Lephenixnoir/gint

      - name: Build BusinessFX.g3a
        id: build
        run: fxsdk build-cg

      - uses: actions/upload-artifact@v4
        with:
          name: BusinessFX-g3a
          path: build-cg/BusinessFX.g3a

      - name: Diagnostics
        if: failure()
        run: |
          echo "::error title=steps::apt=${{ steps.apt.outcome }} gp=${{ steps.gp.outcome }} path=${{ steps.path.outcome }} tc=${{ steps.tc.outcome }} build=${{ steps.build.outcome }}"
          echo "::error title=tools::giteapc=$(command -v giteapc || echo NO) fxsdk=$(command -v fxsdk || echo NO) gcc=$(command -v sh-elf-gcc || echo NO)"
          echo "::error title=found::$(find $HOME /usr/local -name 'giteapc*' 2>/dev/null | head -5 | tr '\n' ' ')"
          echo "::error title=localbin::$(ls $HOME/.local/bin 2>&1 | head -20 | tr '\n' ' ')"
