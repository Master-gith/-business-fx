name: build-g3a
on: [push, pull_request, workflow_dispatch]

jobs:
  g3a:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.giteapc
          key: fxsdk-toolchain-v5

      - name: System packages
        id: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3 python3-pil python3-pip \
            pkg-config libpng-dev libusb-1.0-0-dev libudisks2-dev libsdl2-dev \
            libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex curl

      - name: Install GiteaPC
        id: gp
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://gitea.planet-casio.com/Lephenixnoir/GiteaPC.git /tmp/GiteaPC
          cd /tmp/GiteaPC
          ./install.sh

      - name: Create giteapc command and set PATH
        id: path
        run: |
          mkdir -p "$HOME/.local/bin"
          GP="$HOME/.local/share/giteapc/Lephenixnoir/GiteaPC/giteapc.py"
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' "$GP" > "$HOME/.local/bin/giteapc"
          chmod +x "$HOME/.local/bin/giteapc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install sh-elf-gcc, fxSDK and gint
        id: tc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          giteapc install -y Lephenixnoir/sh-elf-gcc 2>&1 | tee /tmp/tc.log
          giteapc install -y Lephenixnoir/fxsdk 2>&1 | tee -a /tmp/tc.log
          giteapc install -y Lephenixnoir/gint 2>&1 | tee -a /tmp/tc.log

      - name: Build BusinessFX.g3a
        id: build
        run: |
          fxsdk build-cg
          echo "::notice title=files::$(find . -name '*.g3a' -o -name 'CMakeCache.txt' | head -10 | tr '\n' ' ')"
          echo "::notice title=builddir::$(ls build-cg 2>&1 | head -30 | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: BusinessFX-g3a
          path: |
            **/*.g3a
          if-no-files-found: error

      - name: Diagnostics
        if: failure()
        run: |
          echo "::error title=steps::apt=${{ steps.apt.outcome }} gp=${{ steps.gp.outcome }} path=${{ steps.path.outcome }} tc=${{ steps.tc.outcome }} build=${{ steps.build.outcome }}"
          echo "::error title=tools::giteapc=$(command -v giteapc || echo NO) fxsdk=$(command -v fxsdk || echo NO) gcc=$(command -v sh-elf-gcc || echo NO)"
